name: Tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  tests:
    name: Tests
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Run the tests
        run: python -X utf8 -W ignore::ResourceWarning -m unittest discover -s tests -t . -v
